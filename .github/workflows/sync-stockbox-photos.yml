name: Sync verified 2026 StockBox gift photos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_stockbox_photos.py'
      - '.github/workflows/sync-stockbox-photos.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check missing 2026 gift photos on StockBox
        run: python scripts/sync_stockbox_photos.py
      - name: Commit verified secondary photo mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockbox_photos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified 2026 StockBox photos"
            git push
          else
            echo "No newly verified gift photos"
          fi
